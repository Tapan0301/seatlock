server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://localhost:3306/booking_db
    username: booking
    password: booking
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: dev
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

seatlock:
  allocation:
    strategy: optimistic          # optimistic | pessimistic | redis
  hold:
    duration: 5m
    expiry-check-interval: 10s
  admission:
    enabled: false                # switch on once waiting-room-service is built
    secret: ${ADMISSION_TOKEN_SECRET:local-dev-admission-secret-change-me-0123456789}
  payment:
    base-url: http://localhost:8082
