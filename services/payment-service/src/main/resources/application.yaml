server:
  port: 8082

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db
    username: payment
    password: payment
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

seatlock:
  provider:
    failure-rate: 0.10            # 10% of payments are declined
    timeout-rate: 0.05            # 5% hang long enough to trip the caller's timeout
    min-latency: 50ms
    max-latency: 300ms
    timeout-latency: 5s
