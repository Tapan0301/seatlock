name: seatlock

services:
  mysql:
    image: mysql:8.4
    container_name: seatlock-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seatlock
      MYSQL_USER: seatlock
      MYSQL_PASSWORD: seatlock
    command: ["--max-connections=500"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data: